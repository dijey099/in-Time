{% extends "base.html" %}
{% block title %}Attendances{% endblock %}
{% block content %}
<h1>Attendances</h1>
<form method="get" class="filters">
  {% include "_date_fields.html" %}
  <label>Collaborator ID <input name="collaborator" value="{{ args.collaborator or '' }}" size="10"></label>
  <label>Relay
    <select name="relay"><option value="">all</option>
      {% for r in relays %}<option value="{{ r.id }}" {{ 'selected' if args.relay == r.id|string }}>{{ r.name }}</option>{% endfor %}
    </select></label>
  <label>Status
    <select name="status"><option value="">all</option>
      {% for s in ['OK', 'KO'] %}<option {{ 'selected' if args.status == s }}>{{ s }}</option>{% endfor %}
    </select></label>
  <label>Checks
    <select name="face"><option value="">all</option>
      {% for v, l in [('flagged', 'flagged (face or time)'), ('match', 'match'), ('unchecked', 'not checked')] %}<option value="{{ v }}" {{ 'selected' if args.face == v }}>{{ l }}</option>{% endfor %}
    </select></label>
  <label>Location
    <select name="area"><option value="">all</option>
      {% for v, l in [('outside', 'outside site area'), ('inside', 'on site'), ('no_location', 'no location')] %}<option value="{{ v }}" {{ 'selected' if args.area == v }}>{{ l }}</option>{% endfor %}
    </select></label>
  <button>Filter</button>
  <a class="button secondary" href="{{ url_for('admin.attendances_csv', **args) }}">Export CSV</a>
</form>
{% include "_checkin_rows.html" %}
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='date_fields.js') }}"></script>
{% endblock %}
